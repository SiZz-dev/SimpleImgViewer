spring:
  config:
    import: "optional:file:${IMAGEGATE_CONFIG:./config/imagegate.yml}"
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: imagegate
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  file:
    path: ./.runtime/logs # 감사 로그 경로. OS 접근 권한 설정 필요

imagegate:
  audit:
    enabled: true # 변경/반출 요청 결과와 변환 실패. 본문·파일명·경로 제외
  upload:
    tenant-original-max-bytes: 0 # 조직별 원본 누적 바이트 상한. 0=비활성, 최대 1 PiB. 재시작 필요
    max-file-bytes: 104857600 # 1~104857600바이트. 공통 Servlet 상한은 원본/스탬프 상한 중 큰 값
    max-concurrent: 4 # 1~16, 원본 등록 복사 동시 처리
    max-concurrent-per-user: 2 # 1~8, 전체 상한 이하
    min-free-bytes: 536870912 # 512 MiB, 0이면 여유 공간 검사 생략
    multipart-directory: ./.runtime/multipart # 서비스 계정 전용 수신 임시 경로. 네 저장소와 중첩 금지
    multipart-overhead-bytes: 65536 # 1024~1048576, 공통 파일 상한에 더하는 요청 전체 여유
    multipart-max-concurrent: 4 # 1~16, 파싱 전 전체 multipart 수신 슬롯(원본/스탬프 공유)
    body-read-idle-timeout: 30s # 1s~5m, HTTP/1.1 본문 다음 데이터 대기 상한(전체 전송 시간 아님)
  storage:
    root: ${IMAGEGATE_STORAGE_ROOT:./.runtime/media}
    originals-directory: originals
    converted-directory: derived
    annotations-directory: annotations
    stamps-directory: stamps
  features:
    image:
      enabled: true
      rotation: true
      zoom: true
      crop-and-save: true
      brightness: true
      annotations: true
      magnifier: true
      stamps: true
      stamp-upload: true
      export-edited: true
    video:
      enabled: true
      seek: true
      playback-speed: true
    audio:
      enabled: true
      seek: true
      playback-speed: true
  conversion:
    enabled: ${IMAGEGATE_CONVERSION_ENABLED:${IMG2TILE_ENABLED:false}}
    module: ${IMAGEGATE_CONVERSION_MODULE:img2tile}
    timeout: 60s
    max-concurrent-jobs: 2
    modules:
      img2tile:
        executable: ${IMG2TILE_EXECUTABLE:D:/DG_module/img2tile/img2tile.exe}
      libvips:
        executable: ${LIBVIPS_EXECUTABLE:D:/ImageGateModules/libvips/bin/vips.exe}
      imagemagick:
        executable: ${IMAGEMAGICK_EXECUTABLE:D:/ImageGateModules/imagemagick/magick.exe}

  tiles:
    enabled: false # 보호된 준비/상태·PNG API. UI 연결은 후속. 승인 TIFF RGB8/방향1만 처리
    workers: 1 # 1~2, 네이티브 슬롯은 기존 conversion과 공유
    queue-capacity: 8 # 1~32, 대기 작업 수
    max-tracked-jobs: 256 # 1~1024, 영속 상태 상한. maintenance의 terminal 기록 정리와 별개인 hard 접수 상한
    timeout: 120s # 1s~5m, 대기 제외 작업 기한/협력적 인터럽트
    max-source-pixels: 40000000
    max-tiles: 4096
    max-tile-bytes: 2097152
    max-page-bytes: 268435456 # native/정규화 각각의 검증 예산. OS 디스크 하드 한도 아님
    min-free-bytes: 1073741824 # 여유 공간+접수한 작업의 보수적 예약을 검사
    cache-version: tiles-v1
    maintenance:
      enabled: true # tiles.enabled=true인 경우에만 스케줄러 실행. 기동 재계수는 항상 수행
      retention: 7d
      interval: 5m
      max-bytes: 8589934592 # 완료 캐시 정리 목표(8GiB), 볼륨 하드 한도 아님
      history-retention: 1d # 오래된 terminal 상태·압박 시 재생성 가능한 ready 기록 정리
      work-retention: 1h # 소유 기록/완성 매니페스트로 확인 가능한 중단 폴더만
      max-scan-entries: 2048 # 16~4096, 기동/정리 탐색·신규 접수 구조 상한

  preview:
    enabled: true
    metrics-enabled: false # 고정 운영 지표 수집. 외부 관리 엔드포인트 노출과 별개, 재시작 필요
    workers: 2
    original-open:
      enabled: false # 환경별 검증 후 선택. 미리보기 SHA용 원본 open 호출만 제한
      max-concurrent: 1 # 1~4, 읽기/SHA/디코딩 수명은 포함하지 않음
      wait-timeout: 10s # 1ms~1m 정수 밀리초. native open 자체의 제한 시간 아님
    queue-capacity: 32
    max-width: 1600
    max-height: 1600
    thumbnail-enabled: true
    thumbnail-max-edge: 256 # 64~512, 비율 유지·원본보다 확대하지 않음
    max-source-pixels: 16000000
    cache-version: preview-v1
    cache:
      enabled: true
      retention: 7d
      cleanup-interval: 5m
      max-bytes: 5368709120 # 5 GiB, 완료 PNG의 주기 정리 목표

  viewer:
    session-ttl: 30m
    max-sessions: 1000
    max-sessions-per-user: 20

  editing:
    max-annotations-per-page: 100
    max-note-length: 2000
    max-stamps-per-user: 100
    max-stamp-upload-bytes: 5242880
    max-stamp-pixels: 4194304
    history:
      enabled: true
      max-steps: 20
      max-contexts: 128
      max-contexts-per-user: 8
      ttl: 30m

  crop:
    max-source-pixels: 16000000
    max-output-pixels: 8000000
    max-output-bytes: 16777216
    max-concurrent-jobs: 1

  playback:
    enabled: false
    ffmpeg: D:/DG_module/ffmpeg/bin/ffmpeg.exe
    ffprobe: D:/DG_module/ffmpeg/bin/ffprobe.exe
    ffmpeg-sha256: ""
    ffprobe-sha256: ""
    timeout: 120s
    workers: 1
    queue-capacity: 8
    max-duration-seconds: 7200
    max-source-pixels: 8294400
    max-output-bytes: 268435456
    max-streams: 32
    cache-version: playback-v1
    # 재생 완료 캐시만 정리. 전송/변환 중인 파일과 원본은 제외.
    cache:
      enabled: true
      retention: 7d
      cleanup-interval: 5m
      max-bytes: 10737418240 # 10 GiB, 주기 정리 목표(하드 디스크 할당량 아님)
