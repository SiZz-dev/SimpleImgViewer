import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.util.zip.ZipInputStream
import java.security.MessageDigest
import java.util.zip.ZipFile
import javax.xml.parsers.DocumentBuilderFactory
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact

// Build-time tooling only. Do not run inside HTTP requests or download license URLs.
def hexDigest = { byte[] value -> HexFormat.of().formatHex(MessageDigest.getInstance('SHA-256').digest(value)) }
def hashFile = { File input ->
    def digest = MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream -> byte[] block=new byte[32768]; int n; while((n=stream.read(block))!=-1)digest.update(block,0,n) }
    HexFormat.of().formatHex(digest.digest())
}
def notices = { File jar, File destination ->
    def records=[]
    new ZipFile(jar).withCloseable { zip ->
        def entries=zip.entries().findAll { !it.directory && it.name ==~ /(?i)(?:.*\/)?(?:license(?:[-_.].*)?|notice(?:[-_.].*)?|copying(?:[-_.].*)?|copyright(?:[-_.].*)?)/ }.sort { it.name }
        if(entries.size()>128)throw new GradleException('Too many notice entries')
        long total=0
        entries.each { entry ->
            byte[] bytes=zip.getInputStream(entry).withCloseable { it.readNBytes(2097153) }
            total+=bytes.length
            if(bytes.length>2097152 || total>16777216)throw new GradleException('Notice text limit exceeded')
            String name=hexDigest(entry.name.getBytes('UTF-8'))+'.txt'
            destination.mkdirs();new File(destination,name).bytes=bytes
            records << [entry:entry.name,sha256:hexDigest(bytes),text:'texts/'+destination.name+'/'+name]
        }
    }
    records
}
def pomLicenses = { File pom ->
    if(pom.length()>2097152)throw new GradleException('POM limit exceeded')
    def factory=DocumentBuilderFactory.newInstance();factory.namespaceAware=true
    factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl',true)
    factory.setFeature('http://xml.org/sax/features/external-general-entities',false)
    factory.setFeature('http://xml.org/sax/features/external-parameter-entities',false)
    factory.setXIncludeAware(false);factory.setExpandEntityReferences(false)
    def document=factory.newDocumentBuilder().parse(pom)
    def result=[];def parents=document.documentElement.childNodes
    for(int i=0;i<parents.length;i++)if(parents.item(i).localName=='licenses'){
        def nodes=parents.item(i).childNodes
        for(int j=0;j<nodes.length;j++)if(nodes.item(j).localName=='license'){
            def values=[:];def fields=nodes.item(j).childNodes
            for(int k=0;k<fields.length;k++)if(fields.item(k).localName in ['name','url','distribution'])values[fields.item(k).localName]=fields.item(k).textContent.trim()
            result<<values
        }
    }
    def parent=document.documentElement.getElementsByTagNameNS('*','parent')
    def identity=[:]
    if(parent.length>0){def fields=parent.item(0).childNodes;for(int i=0;i<fields.length;i++)if(fields.item(i).localName in ['groupId','artifactId','version'])identity[fields.item(i).localName]=fields.item(i).textContent.trim()}
    [licenses:result,parent:identity]
}

tasks.register('runtimeLicenseInventory') {
    group='verification'
    description='Inventories runtime JAR hashes, POM declarations and embedded notice texts (not legal approval)'
    dependsOn tasks.named('bootJar')
    outputs.upToDateWhen { false }
    doLast {
        def target=layout.buildDirectory.dir('reports/licenses').get().asFile;target.mkdirs()
        def artifacts=configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.sort { it.moduleVersion.id.toString()+it.name }
        def components=artifacts.collect { it.id.componentIdentifier }.unique()
        def poms=[:]
        dependencies.createArtifactResolutionQuery().forComponents(components).withArtifacts(MavenModule,MavenPomArtifact).execute().resolvedComponents.each { component ->
            def found=component.getArtifacts(MavenPomArtifact).findAll { it instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult }
            if(found.size()==1)poms[component.id]=found.first().file
        }
        def records=artifacts.collect { artifact ->
            def id=artifact.moduleVersion.id;def hash=hashFile(artifact.file);def pom=poms[artifact.id.componentIdentifier]
            if(artifact.extension!='jar')throw new GradleException('Unexpected runtime artifact type')
            [coordinate:id.group+':'+id.name+':'+id.version,file:artifact.file.name,sha256:hash,
                declaredLicenses:pom?pomLicenses(pom).licenses:[],pomSha256:pom?hashFile(pom):null,
                notices:notices(artifact.file,new File(target,'texts/'+hash))]
        }
        def boot=tasks.named('bootJar').get().archiveFile.get().asFile
        def embedded=[]
        new ZipFile(boot).withCloseable { zip ->
            zip.entries().findAll { !it.directory&&it.name.startsWith('BOOT-INF/lib/') }.each { entry ->
                def digest=MessageDigest.getInstance('SHA-256')
                zip.getInputStream(entry).withCloseable { stream -> byte[] block=new byte[32768];int n;while((n=stream.read(block))!=-1)digest.update(block,0,n) }
                embedded<<[file:entry.name.substring('BOOT-INF/lib/'.length()),sha256:HexFormat.of().formatHex(digest.digest())]
            }
        }
        // Resolve POM inheritance as evidence, without turning license names into automatic approval.
        records.each { record ->
            def evidence=[];def coordinate=record.coordinate;def seen=[] as Set
            for(int depth=0;depth<8;depth++){
                if(!seen.add(coordinate))throw new GradleException('POM parent cycle')
                def parts=coordinate.split(':',-1)
                if(parts.length!=3||parts.any{!(it==~ /[A-Za-z0-9_.-]+/)})throw new GradleException('Unresolved POM parent identity')
                def query=dependencies.createArtifactResolutionQuery().forModule(parts[0],parts[1],parts[2]).withArtifacts(MavenModule,MavenPomArtifact).execute()
                def pom=query.resolvedComponents.collectMany{it.getArtifacts(MavenPomArtifact)}.find{it instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult}?.file
                if(!pom)throw new GradleException('POM evidence unavailable: '+coordinate)
                def data=pomLicenses(pom);evidence<<[coordinate:coordinate,sha256:hashFile(pom),licenses:data.licenses]
                if(data.licenses||!data.parent)break
                coordinate=data.parent.groupId+':'+data.parent.artifactId+':'+data.parent.version
            }
            record.declaredLicenses=evidence.find{it.licenses}?.licenses?:[];record.pomEvidence=evidence
        }
        def loader=MessageDigest.getInstance('SHA-256');int loaderEntries=0
        new ZipFile(boot).withCloseable { zip ->
            zip.entries().findAll{!it.directory&&it.name.startsWith('org/springframework/boot/loader/')}.sort{it.name}.each{ entry ->
                loader.update(entry.name.getBytes('UTF-8'));loader.update((byte)0)
                zip.getInputStream(entry).withCloseable{stream->byte[] block=new byte[32768];int n;while((n=stream.read(block))!=-1)loader.update(block,0,n)}
                loaderEntries++
            }
            embedded.findAll { item -> !records.any{it.file==item.file} }.each { item ->
                def texts=[];long total=0
                def nested=zip.getEntry('BOOT-INF/lib/'+item.file)
                new ZipInputStream(zip.getInputStream(nested)).withCloseable{ inside ->
                    def entry
                    while((entry=inside.nextEntry)!=null){
                        if(!entry.directory&&entry.name==~ /(?i)(?:.*\/)?(?:license(?:[-_.].*)?|notice(?:[-_.].*)?|copying(?:[-_.].*)?|copyright(?:[-_.].*)?)/){
                            byte[] bytes=inside.readNBytes(2097153);total+=bytes.length
                            if(bytes.length>2097152||total>16777216||texts.size()>=128)throw new GradleException('Nested notice limit exceeded')
                            String name=hexDigest(entry.name.getBytes('UTF-8'))+'.txt';def directory=new File(target,'texts/'+item.sha256);directory.mkdirs();new File(directory,name).bytes=bytes
                            texts<<[entry:entry.name,sha256:hexDigest(bytes),text:'texts/'+item.sha256+'/'+name]
                        }
                    }
                }
                String coordinate=item.file==~ /spring-boot-jarmode-tools-[0-9.]+.jar/?'org.springframework.boot:spring-boot-jarmode-tools:'+item.file.substring(26,item.file.length()-4):'UNMAPPED:'+item.file
                records<<[coordinate:coordinate,file:item.file,sha256:item.sha256,origin:'bootJar-injected',notices:texts]
            }
        }
        records=records.sort{it.coordinate}
        def report=[schemaVersion:1,scope:'runtimeClasspath and executable JAR',generatedAt:java.time.Instant.now().toString(),
            components:records,packagedLibraries:embedded.sort{it.file},
            launcher:[sha256:HexFormat.of().formatHex(loader.digest()),entries:loaderEntries],
            launcherNotices:notices(boot,new File(target,'texts/launcher'))]
        new File(target,'runtime-inventory.json').text=JsonOutput.prettyPrint(JsonOutput.toJson(report))+'\n'
        logger.lifecycle('Runtime inventory: '+records.size()+' dependencies, '+embedded.size()+' packaged libraries; build/reports/licenses/runtime-inventory.json')
    }
}

// Compare an identified, pinned baseline; this is not a distribution-compliance or vulnerability scanner.
def validateInventory = { Map inventory, Map policy ->
    def errors=[]
    def allowed=['Apache-2.0','MIT','BSD-2-Clause','EPL-1.0','EPL-2.0'] as Set
    if(inventory.schemaVersion!=1||policy.schemaVersion!=1)errors<<'Unsupported schema'
    def actual=inventory.components?:[];def expected=policy.components?:[]
    if(!actual||!expected)errors<<'Empty component list'
    if(actual.collect{it.coordinate}.unique().size()!=actual.size()||expected.collect{it.coordinate}.unique().size()!=expected.size())errors<<'Duplicate component identity'
    if(actual.collect{it.file}.unique().size()!=actual.size())errors<<'Duplicate artifact filename'
    def actualBy=actual.collectEntries{[(it.coordinate):it]};def expectedBy=expected.collectEntries{[(it.coordinate):it]}
    if(actualBy.keySet()!=expectedBy.keySet())errors<<'Component set changed; identify added/removed versions explicitly'
    expected.each { pin ->
        if(pin.reviewStatus!='IDENTIFIED'||!allowed.contains(pin.primaryLicense)||!(pin.source instanceof String)||!pin.source.startsWith('https://'))errors<<'Unidentified license evidence: '+pin.coordinate
        def item=actualBy[pin.coordinate]
        if(item){
            if(item.sha256!=pin.sha256||item.file!=pin.file)errors<<'JAR identity changed: '+pin.coordinate
            def texts=(item.notices?:[]).collect{[entry:it.entry,sha256:it.sha256]}.sort{it.entry}
            if(texts!=pin.notices)errors<<'Embedded notices changed: '+pin.coordinate
            def poms=(item.pomEvidence?:[]).collect{[coordinate:it.coordinate,sha256:it.sha256]}
            if(poms!=pin.pomEvidence)errors<<'POM evidence changed: '+pin.coordinate
        }
    }
    def packaged=inventory.packagedLibraries?:[]
    if(packaged.collect{it.file}.unique().size()!=packaged.size())errors<<'Duplicate packaged library'
    def wanted=expected.findAll{it.packaged}.collectEntries{[(it.file):it.sha256]}
    def found=packaged.collectEntries{[(it.file):it.sha256]}
    if(wanted!=found)errors<<'Packaged library set/hash changed'
    if(!inventory.launcher?.entries||inventory.launcher!=policy.launcher?.identity||policy.launcher?.primaryLicense!='Apache-2.0')errors<<'Launcher identity/license changed'
    errors
}

tasks.register('verifyRuntimeLicenses') {
    group='verification';description='Rejects unrecognized versions, JAR/POM/notice changes and packaging drift'
    dependsOn tasks.named('runtimeLicenseInventory'),tasks.named('licenseAuditRulesTest')
    doLast {
        def directory=layout.buildDirectory.dir('reports/licenses').get().asFile
        def inventory=new JsonSlurper().parse(new File(directory,'runtime-inventory.json'))
        def policy=new JsonSlurper().parse(file('config/oss/runtime-license-baseline.json'))
        def errors=validateInventory(inventory,policy)
        def result=[schemaVersion:1,passed:errors.empty,scope:'Pinned runtime inventory only; distribution readiness not asserted',errors:errors,
            components:inventory.components.size(),packagedLibraries:inventory.packagedLibraries.size(),
            missingEmbeddedNoticeTexts:inventory.components.findAll{!it.notices}.collect{it.coordinate},
            distributionReady:false]
        new File(directory,'verification.json').text=JsonOutput.prettyPrint(JsonOutput.toJson(result))+'\n'
        if(errors)throw new GradleException('Runtime license inventory verification failed: '+errors.join('; '))
        logger.lifecycle('Verified '+inventory.components.size()+' identified components and '+inventory.packagedLibraries.size()+' packaged JARs; distribution readiness remains separate')
    }
}

tasks.register('licenseAuditRulesTest') {
    group='verification';description='Exercises fail-closed inventory checks with changed/missing/unrecognized fixture components'
    doLast {
        def component=[coordinate:'example:library:1',file:'library-1.jar',sha256:'a'*64,
            notices:[[entry:'META-INF/LICENSE',sha256:'b'*64]],pomEvidence:[[coordinate:'example:library:1',sha256:'c'*64]]]
        def inventory=[schemaVersion:1,components:[component],packagedLibraries:[[file:component.file,sha256:component.sha256]],launcher:[sha256:'d'*64,entries:1]]
        def policy=[schemaVersion:1,components:[component+[packaged:true,reviewStatus:'IDENTIFIED',primaryLicense:'Apache-2.0',source:'https://example.org/license']],launcher:[identity:inventory.launcher,primaryLicense:'Apache-2.0']]
        def clone={value->new JsonSlurper().parseText(JsonOutput.toJson(value))}
        if(validateInventory(inventory,policy))throw new GradleException('Valid license fixture rejected')
        def changes=[
            {i,p->i.components<<clone(component)+[coordinate:'unknown:library:1',file:'unknown.jar']},
            {i,p->i.components[0].sha256='e'*64},
            {i,p->i.components[0].notices[0].sha256='e'*64},
            {i,p->i.components[0].pomEvidence[0].sha256='e'*64},
            {i,p->i.components=[]},
            {i,p->i.packagedLibraries=[]},
            {i,p->i.packagedLibraries<<[file:'unknown.jar',sha256:'e'*64]},
            {i,p->i.packagedLibraries[0].sha256='e'*64},
            {i,p->i.launcher.sha256='e'*64},
            {i,p->p.components[0].primaryLicense='GPL-3.0-only'},
            {i,p->p.components[0].source=''},
            {i,p->i.components<<clone(component)},
            {i,p->i.schemaVersion=2},
            {i,p->p.components[0].reviewStatus='PENDING'},
            {i,p->p.components[0].packaged=false}
        ]
        changes.eachWithIndex{ change,index ->
            def i=clone(inventory);def p=clone(policy);change(i,p)
            if(validateInventory(i,p).empty)throw new GradleException('Unsafe license fixture accepted: '+index)
        }
        logger.lifecycle('License inventory rules: '+(changes.size()+1)+' scenarios passed')
    }
}

tasks.named('check'){dependsOn tasks.named('verifyRuntimeLicenses')}
