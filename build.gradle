plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
}

group = 'co.kr.satu.imagegate'
version = '0.1.0-SNAPSHOT'
description = 'Secure image, video and audio viewer'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test') {
    inputs.files('config/imagegate.example.yml', 'config/proxy/imagegate.backend.example.yml')
            .withPropertyName('installationYamlExamples')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    useJUnitPlatform {
        excludeTags 'performance', 'http-performance', 'mixed-media-performance', 'tile-profile', 'png-codec-profile', 'png-crossover', 'native-diagnostic', 'preview-stress', 'original-stream', 'original-open-context', 'original-open-admission', 'preview-metrics-comparison'
        if (!project.hasProperty('nativeViewerIntegration')) {
            excludeTags 'native-viewer'
        }
        if (!project.hasProperty('img2tileIntegration')) {
            excludeTags 'img2tile'
        }
        if (!project.hasProperty('ffmpegIntegration')) {
            excludeTags 'ffmpeg'
        }
    }
}

// Real installed modules, synthetic private media and loopback HTTP only; never part of normal build.
tasks.register('nativeCompatibilityDiagnostic', Test) {
    description = 'Creates synthetic JP2/J2K inputs, expected/native outputs and a path-free module handoff report'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'native-diagnostic' }
    maxParallelForks = 1
    maxHeapSize = '512m'
    outputs.upToDateWhen { false }
    testLogging { events 'passed', 'failed'; showStandardStreams = true }
}

tasks.register('tilePreparationProfileTest', Test) {
    description = 'Profiles real native TIFF tile preparation stages with synthetic 24MP inputs'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'tile-profile' }
    maxParallelForks = 1
    maxHeapSize = '1024m'
    outputs.upToDateWhen { false }
    systemProperty 'imagegate.tileProfile.rounds', providers.gradleProperty('tileProfileRounds').getOrElse('3')
    systemProperty 'imagegate.tileProfile.label', providers.gradleProperty('tileProfileLabel').getOrElse('baseline')
    testLogging { events 'passed', 'failed'; showStandardStreams = true }
}

tasks.register('pngCodecProfileTest', Test) {
    description = 'Compares exact-pixel PNG copy/compression candidates on bounded synthetic tiles'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'png-codec-profile' }
    maxParallelForks = 1
    maxHeapSize = '512m'
    outputs.upToDateWhen { false }
    testLogging { events 'passed', 'failed'; showStandardStreams = true }
}

tasks.register('pngCrossoverTest', Test) {
    description = 'Alternates reference/owned-buffer native tile preparation in one JVM with allocation and GC counters'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'png-crossover' }
    maxParallelForks = 1
    minHeapSize = '256m'
    maxHeapSize = '1024m'
    outputs.upToDateWhen { false }
    systemProperty 'imagegate.pngCrossover.pairs', providers.gradleProperty('pngCrossoverPairs').getOrElse('4')
    testLogging { events 'passed', 'failed'; showStandardStreams = true }
}

tasks.register('mixedMediaPerformanceTest', Test) {
    description = 'Measures large TIFF preview/tile and media Range latency during real native conversion'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'mixed-media-performance' }
    maxParallelForks = 1
    minHeapSize = '256m'
    maxHeapSize = '1024m'
    outputs.upToDateWhen { false }
    systemProperty 'imagegate.mixed.reportDirectory', layout.buildDirectory.dir('reports/mixed-media-performance').get().asFile.absolutePath
    systemProperty 'imagegate.mixed.requests', providers.gradleProperty('mixedRequests').getOrElse('200')
    systemProperty 'imagegate.mixed.maxP95Ms', providers.gradleProperty('mixedMaxP95Ms').getOrElse('0')
    systemProperty 'imagegate.mixed.nativeSlots', providers.gradleProperty('mixedNativeSlots').getOrElse('2')
    testLogging { events 'passed', 'failed'; showStandardStreams = true }
}

tasks.named('wrapper') {
    gradleVersion = '8.14.5'
    distributionType = Wrapper.DistributionType.BIN
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.register('installationZip', Zip) {
    dependsOn tasks.named('bootJar')
    archiveFileName = "imagegate-${project.version}-installation.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into("imagegate-${project.version}") {
        from(tasks.named('bootJar')) { into 'lib' }
        from('config/imagegate.example.yml') {
            into 'config'
            rename { 'imagegate.yml' }
        }
        from('scripts') {
            include 'start.ps1', 'start.sh'
            into 'bin'
        }
        from('docs') {
            include 'INSTALLATION.md', 'CONVERSION_EXECUTION.md', 'OPEN_SOURCE_POLICY.md', 'ARCHITECTURE.md', 'MEDIA_SECURITY.md', 'API_CONTRACT.md', 'PREVIEW_PIPELINE.md'
            into 'docs'
        }
    }
}

// Opt-in, isolated synthetic API benchmark. Never participates in build or packaging.
tasks.register('performanceTest', Test) {
    description = 'Measures synthetic cold/warm viewer API latency without production authentication changes'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'performance'; excludeTags 'http-performance' }
    maxParallelForks = 1
    minHeapSize = '256m'
    maxHeapSize = '1g'
    outputs.upToDateWhen { false }
    systemProperty 'imagegate.performance.reportDirectory', layout.buildDirectory.dir('reports/performance').get().asFile.absolutePath
    systemProperty 'imagegate.performance.storageDirectory', layout.buildDirectory.dir('performance').get().asFile.absolutePath
    systemProperty 'imagegate.performance.coldSamples', providers.gradleProperty('performanceColdSamples').getOrElse('5')
    systemProperty 'imagegate.performance.warmRequests', providers.gradleProperty('performanceWarmRequests').getOrElse('24')
    systemProperty 'imagegate.performance.native', providers.gradleProperty('performanceImg2tile').getOrElse('false')
    systemProperty 'imagegate.performance.maxWarmP95Ms', providers.gradleProperty('performanceMaxWarmP95Ms').getOrElse('0')
    testLogging { events 'passed', 'failed'; showStandardStreams = true }
}

apply from: 'gradle/license-audit.gradle'

