# ImageGate 설치 설정 예제
# config/imagegate.yml로 복사해 수정하거나 IMAGEGATE_CONFIG로 경로를 지정하세요.
# 변경 후 서버 재시작 필요. 비밀번호/토큰은 여기에 넣지 마세요.
# 설치 ZIP에는 이 파일이 config/imagegate.yml 이름으로 포함됩니다.

server:
  port: 8080
  address: 127.0.0.1   # 외부 직접 접근이 필요할 때 설치자가 명시적으로 변경

logging:
  file:
    path: ./.runtime/logs # 감사 로그 경로. OS 접근 권한 설정 필요

imagegate:
  audit:
    enabled: true # 변경/반출 요청 결과와 변환 실패. 본문·파일명·경로 제외
  upload:
    tenant-original-max-bytes: 0 # 조직별 원본 누적 바이트 상한. 0=비활성, 최대 1 PiB. 재시작 필요
    max-file-bytes: 104857600 # 1~104857600바이트. 공통 Servlet 상한은 원본/스탬프 상한 중 큰 값
    max-concurrent: 4 # 1~16, 원본 등록 복사 동시 처리
    max-concurrent-per-user: 2 # 1~8, 전체 상한 이하
    min-free-bytes: 536870912 # 512 MiB, 0이면 여유 공간 검사 생략
    multipart-directory: ./.runtime/multipart # 서비스 계정 전용 수신 임시 경로. 네 저장소와 중첩 금지
    multipart-overhead-bytes: 65536 # 1024~1048576, 공통 파일 상한에 더하는 요청 전체 여유
    multipart-max-concurrent: 4 # 1~16, 파싱 전 전체 multipart 수신 슬롯(원본/스탬프 공유)
    body-read-idle-timeout: 30s # 1s~5m, HTTP/1.1 본문 다음 데이터 대기 상한(전체 전송 시간 아님)
  storage:
    root: ./data
    # 상대 경로는 root 기준. 서로 독립적인 절대 경로도 지정 가능.
    # 예: originals-directory: D:/ImageGateData/originals
    #     converted-directory: E:/ImageGateCache/converted
    annotations-directory: annotations
    stamps-directory: stamps
    originals-directory: originals
    converted-directory: converted

  features:
    # 서버 설치 정책. 사용자별 파일/행위 권한은 별도로 적용.
    # 아직 개발 중인 API/UI 기능을 true로 해도 구현이 자동 제공되지는 않습니다.
    image:
      enabled: true
      rotation: true
      zoom: true
      crop-and-save: true
      brightness: true
      annotations: true
      magnifier: true
      stamps: true
      stamp-upload: true
      export-edited: true
    video:
      enabled: true
      seek: true
      playback-speed: true
    audio:
      enabled: true
      seek: true
      playback-speed: true

  # 외부 실행 공통: 정규 절대 실행/작업 경로, 생성된 최소 환경 및 작업별 TEMP/TMP/TMPDIR/HOME 적용.
  # 임의 부모 환경/PATH 상속 옵션은 제공하지 않음. CPU·메모리·네트워크 하드 격리는 OS 정책 별도.
  # docs/EXTERNAL_PROCESS_SECURITY.md 참조.
  conversion:
    enabled: false   # 내부 모듈 경로 확인 후 true로 변경
    module: img2tile # img2tile | none | libvips | imagemagick
    # EXE/DLL/resource 시작 기준선을 고정. 변경 발견 후 원상복구해도 검토/재시작 전 실행 차단.
    # docs/NATIVE_MODULE_APPROVAL.md 참조. 실제 모듈 설치 경로는 서비스 계정 읽기/실행 전용.
    # 현재 구현은 img2tile만. 다른 모듈로 enabled=true이면 시작 실패(자동 우회 없음).
    # ImageMagick은 미포함. 향후 추가를 위한 예약 설정이며 현재 실행 불가.
    timeout: 60s     # 양수, 최대 5m
    max-concurrent-jobs: 2  # 1~8
    modules:
      img2tile:
        executable: D:/DG_module/img2tile/img2tile.exe
      libvips:
        executable: D:/ImageGateModules/libvips/bin/vips.exe
      imagemagick:
        executable: D:/ImageGateModules/imagemagick/magick.exe

  # 내부 미리보기 큐. conversion.enabled(외부 모듈)와 독립적입니다.
  tiles:
    enabled: false # 보호된 준비/상태·PNG API와 UI. 승인 TIFF RGB8/방향1만 처리
    workers: 1 # 1~2, 네이티브 슬롯은 기존 conversion과 공유
    queue-capacity: 8 # 1~32, 대기 작업 수
    max-tracked-jobs: 256 # 1~1024, 영속 상태 상한. maintenance의 terminal 기록 정리와 별개인 hard 접수 상한
    timeout: 120s # 1s~5m, 대기 제외 작업 기한/협력적 인터럽트
    max-source-pixels: 40000000
    max-tiles: 4096
    max-tile-bytes: 2097152
    max-page-bytes: 268435456 # native/정규화 각각의 검증 예산. OS 디스크 하드 한도 아님
    min-free-bytes: 1073741824 # 여유 공간+접수한 작업의 보수적 예약을 검사
    cache-version: tiles-v1
    maintenance:
      enabled: true # tiles.enabled=true인 경우에만 스케줄러 실행. 기동 재계수는 항상 수행
      retention: 7d
      interval: 5m
      max-bytes: 8589934592 # 완료 캐시 정리 목표(8GiB), 볼륨 하드 한도 아님
      history-retention: 1d # 오래된 terminal 상태·압박 시 재생성 가능한 ready 기록 정리
      work-retention: 1h # 소유 기록/완성 매니페스트로 확인 가능한 중단 폴더만
      max-scan-entries: 2048 # 16~4096, 기동/정리 탐색·신규 접수 구조 상한

  preview:
    enabled: true
    metrics-enabled: false # 고정 운영 지표 수집. 외부 관리 엔드포인트 노출과 별개, 재시작 필요
    workers: 2
    original-open:
      enabled: false # 환경별 검증 후 선택. 미리보기 SHA용 원본 open 호출만 제한
      max-concurrent: 1 # 1~4, 읽기/SHA/디코딩 수명은 포함하지 않음
      wait-timeout: 10s # 1ms~1m 정수 밀리초. native open 자체의 제한 시간 아님
    queue-capacity: 32
    max-width: 1600
    max-height: 1600
    thumbnail-enabled: true
    thumbnail-max-edge: 256 # 64~512, 비율 유지·원본보다 확대하지 않음
    max-source-pixels: 16000000 # JDK 디코딩에 적용. 외부 모듈의 원본 픽셀 상한은 미보장.
    cache-version: preview-v1 # 출력/디코더 정책 변경 배포 시 갱신
    cache:
      enabled: true
      retention: 7d
      cleanup-interval: 5m
      max-bytes: 5368709120 # 5 GiB, 완료 PNG의 주기 정리 목표

  viewer:
    session-ttl: 30m
    max-sessions: 1000
    max-sessions-per-user: 20

  editing:
    max-annotations-per-page: 100
    max-note-length: 2000
    max-stamps-per-user: 100
    max-stamp-upload-bytes: 5242880
    max-stamp-pixels: 4194304
    history:
      enabled: true
      max-steps: 20
      max-contexts: 128
      max-contexts-per-user: 8
      ttl: 30m

  crop:
    max-source-pixels: 16000000
    max-output-pixels: 8000000
    max-output-bytes: 16777216
    max-concurrent-jobs: 1

  playback:
    enabled: false
    ffmpeg: D:/DG_module/ffmpeg/bin/ffmpeg.exe
    ffprobe: D:/DG_module/ffmpeg/bin/ffprobe.exe
    # 현재 확인한 LGPL shared EXE 빌드 해시. 교체 시 신뢰 기대값을 다시 확인해 변경.
    # 인접 DLL도 시작 내용 기준선/캐시 식별에 포함. 로컬 기준선은 공급자 bundle 승인과 별도.
    ffmpeg-sha256: c75913d9c74a3c44aef4234c75c5554a6620ef653a77a8df2f483cfd1bd7483b
    ffprobe-sha256: 10c0bc52dbc56bc71a2180bc01c24cd4439ea4b810e51a956daa5c64921b7911
    timeout: 120s # 재생 준비 1회의 입력 분석·변환·결과 검증이 공유하는 기한(최대 5m)
    workers: 1
    queue-capacity: 8
    max-duration-seconds: 7200
    max-source-pixels: 8294400
    max-output-bytes: 268435456
    max-streams: 32
    cache-version: playback-v1
    # 재생 완료 캐시만 정리. 전송/변환 중인 파일과 원본은 제외.
    cache:
      enabled: true
      retention: 7d
      cleanup-interval: 5m
      max-bytes: 10737418240 # 10 GiB, 주기 정리 목표(하드 디스크 할당량 아님)
